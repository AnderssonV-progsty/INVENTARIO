<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Director General - Aprobacion de pedidos</title>
    <link rel="stylesheet" href="assets/css/catalogo.css" />
    <style>
      .layout {
        display: grid;
        gap: 1rem;
      }

      @media (min-width: 980px) {
        .layout {
          grid-template-columns: 1fr 1fr;
          align-items: start;
        }
      }

      .table-wrap,
      .detail-wrap {
        overflow-x: auto;
      }

      .pedidos-table,
      .detalle-table {
        width: 100%;
        border-collapse: collapse;
      }

      .pedidos-table th,
      .pedidos-table td,
      .detalle-table th,
      .detalle-table td {
        border-bottom: 1px solid #e5e7eb;
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }

      .actions-row,
      .detail-actions {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 0.8rem;
      }

      .muted {
        color: #6b7280;
      }

      .qty-input {
        width: 90px;
      }
    </style>
  </head>
  <body class="view-director">
    <main class="wrapper">
      <header class="page-header">
        <span class="page-role-tag">Rol Director General</span>
        <h1>Aprobacion central de pedidos</h1>
        <p>Revisa pedidos de todas las areas en PENDIENTE_DIRECTOR.</p>
      </header>

      <section class="layout">
        <article class="panel">
          <div class="section-title">
            <h2>Pedidos PENDIENTE_DIRECTOR</h2>
            <button id="btnRecargar" type="button">Recargar</button>
          </div>

          <div class="table-wrap">
            <table class="pedidos-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Area</th>
                  <th>Secretario</th>
                  <th>Fecha</th>
                  <th>Accion</th>
                </tr>
              </thead>
              <tbody id="pedidosBody"></tbody>
            </table>
          </div>
        </article>

        <article class="panel">
          <div class="section-title">
            <h2>Detalle del pedido</h2>
          </div>

          <p id="pedidoSeleccionado" class="muted">
            Selecciona un pedido para editar cantidades.
          </p>

          <div class="detail-wrap">
            <table class="detalle-table">
              <thead>
                <tr>
                  <th>SKU</th>
                  <th>Producto</th>
                  <th>Cantidad</th>
                </tr>
              </thead>
              <tbody id="detalleBody"></tbody>
            </table>
          </div>

          <label for="motivoRechazo">Motivo rechazo (opcional)</label>
          <textarea
            id="motivoRechazo"
            rows="2"
            placeholder="Solo aplica cuando rechazas"
          ></textarea>

          <div class="detail-actions">
            <button id="btnRechazar" type="button">Rechazar</button>
            <button id="btnAprobar" type="button" class="btn-primary">
              Aprobar y enviar a almacen
            </button>
          </div>
        </article>
      </section>

      <section class="panel status-panel">
        <h2>Estado</h2>
        <p id="mensajeEstado">Listo para operar.</p>
      </section>
    </main>

    <script src="assets/js/api-config.js" defer></script>
    <script src="assets/js/director.js" defer></script>
  </body>
</html>
