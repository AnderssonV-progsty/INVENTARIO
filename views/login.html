<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Inventario Papeleria</title>
    <link rel="stylesheet" href="assets/css/catalogo.css" />
    <style>
      .login-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      .login-card {
        width: min(420px, 100%);
      }

      .login-form {
        display: grid;
        gap: 0.9rem;
      }

      .login-actions {
        display: flex;
        gap: 0.6rem;
        justify-content: flex-end;
      }

      .muted {
        color: #6b7280;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="login-wrap">
      <section class="panel login-card">
        <header class="page-header">
          <h1>Iniciar Sesion</h1>
          <p>Sistema de Inventario de Papeleria</p>
        </header>

        <form id="loginForm" class="login-form">
          <label>
            Usuario
            <input
              type="text"
              id="username"
              maxlength="60"
              required
              autocomplete="username"
            />
          </label>
          <label>
            Clave
            <input
              type="password"
              id="password"
              required
              autocomplete="current-password"
            />
          </label>
          <div class="login-actions">
            <button type="submit" class="btn-primary">Entrar</button>
          </div>
        </form>

        <p id="mensajeEstado" class="muted">Ingresa tus credenciales.</p>
      </section>
    </main>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
