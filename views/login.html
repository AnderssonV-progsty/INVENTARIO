<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Inventario Papeleria</title>
    <link rel="stylesheet" href="assets/css/catalogo.css" />
    <style>
      .login-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      .login-card {
        width: min(420px, 100%);
      }

      .login-form {
        display: grid;
        gap: 0.9rem;
      }

      .login-actions {
        display: flex;
        gap: 0.6rem;
        justify-content: flex-end;
      }

      .muted {
        color: #6b7280;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="login-wrap">
      <section class="panel login-card">
        <header class="page-header">
          <h1>Iniciar Sesion</h1>
          <p>Sistema de Inventario de Papeleria</p>
        </header>

        <form id="loginForm" class="login-form">
          <label>
            Usuario
            <input
              type="text"
              id="username"
              maxlength="60"
              required
              autocomplete="username"
            />
          </label>
          <label>
            Clave
            <input
              type="password"
              id="password"
              required
              autocomplete="current-password"
            />
          </label>
          <div class="login-actions">
            <button type="submit" class="btn-primary">Entrar</button>
          </div>
        </form>

        <p id="mensajeEstado" class="muted">Ingresa tus credenciales.</p>
      </section>
    </main>

    <script src="assets/js/api-config.js"></script>
    <script>
      const API_BASE = (window.API_BASE || "../api").replace(/\/+$/, "");
      const API_LOGIN = `${API_BASE}/login.php`;

      const refs = {
        form: document.getElementById("loginForm"),
        username: document.getElementById("username"),
        password: document.getElementById("password"),
        mensaje: document.getElementById("mensajeEstado"),
      };

      document.addEventListener("DOMContentLoaded", async () => {
        const sesion = await obtenerSesion();
        if (sesion) {
          redirigirPorRol(String(sesion.rol || ""));
          return;
        }

        refs.form.addEventListener("submit", iniciarSesion);
      });

      async function obtenerSesion() {
        try {
          const response = await fetch(API_LOGIN, {
            method: "GET",
            headers: { Accept: "application/json" },
          });

          const data = await response.json();
          if (!response.ok || !data.ok) return null;
          return data.data?.usuario || null;
        } catch (error) {
          return null;
        }
      }

      async function iniciarSesion(event) {
        event.preventDefault();

        const username = refs.username.value.trim();
        const password = refs.password.value;

        if (!username || !password) {
          setEstado("Usuario y clave son obligatorios.", true);
          return;
        }

        setEstado("Validando credenciales...");

        try {
          const response = await fetch(API_LOGIN, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.mensaje || "No fue posible iniciar sesion.");
          }

          setEstado("Login exitoso. Redirigiendo...");
          const rol = String(data.data?.usuario?.rol || "");
          redirigirPorRol(rol);
        } catch (error) {
          setEstado(error.message || "Error al iniciar sesion.", true);
        }
      }

      function redirigirPorRol(rol) {
        const rolNormalizado = String(rol || "")
          .trim()
          .toLowerCase();
        const mapa = {
          inventarista: "inventarista.html",
          director: "directivos.html",
          directivo: "directivos.html",
          operario: "operario.html",
          paqueteria: "paqueteria.html",
        };

        window.location.href = mapa[rolNormalizado] || "catalogo.html";
      }

      function setEstado(mensaje, isError = false) {
        refs.mensaje.textContent = mensaje;
        refs.mensaje.style.color = isError ? "#b91c1c" : "#065f46";
      }
    </script>
  </body>
</html>
