<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secretario - Solicitud de papeleria</title>
    <link rel="stylesheet" href="assets/css/catalogo.css" />
    <style>
      .grid {
        display: grid;
        gap: 1rem;
      }

      .products-table,
      .cart-table {
        width: 100%;
        border-collapse: collapse;
      }

      .products-table th,
      .products-table td,
      .cart-table th,
      .cart-table td {
        border-bottom: 1px solid #e5e7eb;
        padding: 0.55rem;
        text-align: left;
      }

      .qty-input {
        width: 90px;
      }

      .status {
        margin: 0;
      }

      .row-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.6rem;
      }
    </style>
  </head>
  <body>
    <main class="wrapper">
      <header class="page-header">
        <span class="page-role-tag">Rol Secretario</span>
        <h1>Pedido de papeleria por area</h1>
        <p>Selecciona productos habilitados y envia un unico pedido.</p>
      </header>

      <section class="panel grid">
        <div class="section-title">
          <h2>Catalogo disponible</h2>
          <button id="btnRecargarCatalogo" type="button">Recargar</button>
        </div>
        <div style="overflow-x: auto">
          <table class="products-table">
            <thead>
              <tr>
                <th>SKU</th>
                <th>Producto</th>
                <th>Stock</th>
                <th>Cantidad</th>
                <th>Accion</th>
              </tr>
            </thead>
            <tbody id="catalogoBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel grid">
        <div class="section-title">
          <h2>Carrito</h2>
        </div>
        <div style="overflow-x: auto">
          <table class="cart-table">
            <thead>
              <tr>
                <th>SKU</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Accion</th>
              </tr>
            </thead>
            <tbody id="carritoBody"></tbody>
          </table>
        </div>

        <label for="observaciones">Observaciones</label>
        <textarea id="observaciones" rows="3" placeholder="Opcional"></textarea>

        <div class="row-actions">
          <button id="btnLimpiar" type="button">Limpiar carrito</button>
          <button id="btnEnviarPedido" type="button" class="btn-primary">
            Enviar pedido
          </button>
        </div>
      </section>

      <section class="panel status-panel">
        <h2>Estado</h2>
        <p id="mensajeEstado" class="status">Listo para iniciar.</p>
      </section>
    </main>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/secretario.js"></script>
  </body>
</html>
