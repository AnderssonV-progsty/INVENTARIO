<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vista Inventarista</title>
    <link rel="stylesheet" href="assets/css/catalogo.css" />
    <style>
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .toolbar-actions {
        display: flex;
        gap: 0.5rem;
      }

      .toolbar-left {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .toolbar-left input {
        min-width: 240px;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      .inventory-table {
        width: 100%;
        border-collapse: collapse;
      }

      .inventory-table th,
      .inventory-table td {
        border-bottom: 1px solid #d1d5db;
        padding: 0.7rem;
        text-align: left;
      }

      .inventory-table td.actions {
        display: flex;
        gap: 0.4rem;
      }

      .tag-active,
      .tag-inactive {
        display: inline-block;
        border-radius: 999px;
        padding: 0.2rem 0.55rem;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .tag-active {
        background: #dcfce7;
        color: #166534;
      }

      .tag-inactive {
        background: #fee2e2;
        color: #991b1b;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .modal {
        width: min(560px, 100%);
        background: #ffffff;
        border-radius: 12px;
        padding: 1rem;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      }

      .modal-title {
        margin: 0 0 0.8rem;
      }

      .modal .form-grid {
        grid-template-columns: 1fr;
      }

      .modal-footer {
        margin-top: 1rem;
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
      }

      .hidden {
        display: none !important;
      }

      .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 9999;
        display: grid;
        gap: 0.5rem;
        width: min(360px, calc(100vw - 2rem));
      }

      .toast {
        border-radius: 10px;
        padding: 0.75rem 0.9rem;
        color: #ffffff;
        font-weight: 600;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.25);
        animation: toast-in 200ms ease-out;
      }

      .toast-success {
        background: #166534;
      }

      .toast-error {
        background: #991b1b;
      }

      @keyframes toast-in {
        from {
          transform: translateY(-8px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @media (max-width: 700px) {
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .toolbar-actions {
          justify-content: flex-start;
          flex-wrap: wrap;
        }

        .toolbar-left input {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrapper">
      <header class="page-header">
        <h1>Panel del Inventarista</h1>
        <p>
          Gestion de productos: crear, actualizar stock, desactivar y reactivar.
        </p>
      </header>

      <section class="panel">
        <div class="toolbar">
          <div class="toolbar-left">
            <h2>Listado de Productos</h2>
            <input
              type="text"
              id="filtroInventario"
              placeholder="Buscar por SKU o nombre"
              aria-label="Buscar por SKU o nombre"
            />
          </div>
          <div class="toolbar-actions">
            <button type="button" id="btnNuevoProducto" class="btn-primary">
              Nuevo producto
            </button>
            <button type="button" id="btnRecargarProductos">Recargar</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="inventory-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>SKU</th>
                <th>Nombre</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="inventarioBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel status-panel">
        <h2>Estado</h2>
        <p id="mensajeEstado">Listo para operar.</p>
      </section>
    </main>

    <div
      id="modalProductoBackdrop"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalProductoTitulo"
    >
      <div class="modal">
        <h3 class="modal-title" id="modalProductoTitulo">Nuevo producto</h3>
        <form id="formProducto">
          <input type="hidden" id="productoId" />
          <div class="form-grid">
            <label>
              SKU
              <input type="text" id="productoSku" maxlength="40" required />
            </label>
            <label>
              Nombre
              <input type="text" id="productoNombre" maxlength="150" required />
            </label>
            <label>
              Stock actual
              <input
                type="number"
                id="productoStock"
                min="0"
                step="1"
                required
              />
            </label>
          </div>
          <div class="modal-footer">
            <button type="button" id="btnCancelarModal" class="btn-secondary">
              Cancelar
            </button>
            <button type="submit" class="btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="assets/js/api-config.js" defer></script>
    <script src="assets/js/inventarista.js" defer></script>
  </body>
</html>
